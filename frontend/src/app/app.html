<header class="site-header">
  <a routerLink="/" class="brand">
    <span class="brand-icon">S</span>
    <span>Shop<span class="brand-accent">Cart</span></span>
  </a>

  <nav class="main-nav">
    <a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
      Shop
    </a>
  </nav>

  <a routerLink="/cart" class="cart-link" aria-label="Open shopping cart">
    <svg xmlns="http://www.w3.org/2000/svg" width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor"
      stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="9" cy="21" r="1"></circle>
      <circle cx="20" cy="21" r="1"></circle>
      <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
    </svg>

    <span>Cart</span>

    @if (cartService.itemCount() > 0) {
    <span class="cart-badge">{{ cartService.itemCount() }}</span>
    }
  </a>
</header>

<main class="page-content">
  <router-outlet></router-outlet>
</main>
